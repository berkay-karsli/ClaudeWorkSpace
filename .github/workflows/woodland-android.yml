name: Root Android

on:
  push:
    paths:
      - "woodland-android/**"
      - ".github/workflows/woodland-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: woodland-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test rules engine and build APK
        run: |
          ./gradlew :engine:test assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Root.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Root.apk
          path: woodland-android/Root.apk
      # A plain .apk download link that works on a phone without logging in.
      - name: Publish to the "woodland-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: woodland-latest
          target_commitish: ${{ github.sha }}
          name: Root fan edition (latest build)
          body: |
            Latest build of the Root fan edition from `${{ github.ref_name }}` (${{ github.sha }}).
            On your phone, tap **Root.apk** below to download and install it.
          files: woodland-android/Root.apk
          make_latest: false
