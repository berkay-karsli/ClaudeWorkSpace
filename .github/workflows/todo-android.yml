name: Daily To-Do Android

on:
  push:
    paths:
      - "todo-android/**"
      - ".github/workflows/todo-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: todo-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: |
          ./gradlew testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk DailyTodo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DailyTodo-apk
          path: todo-android/DailyTodo.apk
      # A plain .apk download link that works on a phone without logging in.
      - name: Publish to the "todo-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: todo-latest
          target_commitish: ${{ github.sha }}
          name: Daily To-Do (latest build)
          body: |
            Latest build of the Daily To-Do app from `${{ github.ref_name }}` (${{ github.sha }}).
            On your phone, tap **DailyTodo.apk** below to download and install it.
          files: todo-android/DailyTodo.apk
          make_latest: false
