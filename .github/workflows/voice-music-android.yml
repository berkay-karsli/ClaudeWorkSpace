name: Voice Music Android

on:
  push:
    paths:
      - "voice-music-android/**"
      - ".github/workflows/voice-music-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-music-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: |
          ./gradlew testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VoiceMusic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusic-apk
          path: voice-music-android/VoiceMusic.apk
      # A plain .apk download link that works on a phone without logging in.
      - name: Publish to the "voice-music-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-music-latest
          target_commitish: ${{ github.sha }}
          name: Voice Music (latest build)
          body: |
            Latest build of the Voice Music app from `${{ github.ref_name }}` (${{ github.sha }}).
            On your phone, tap **VoiceMusic.apk** below to download and install it.
          files: voice-music-android/VoiceMusic.apk
          make_latest: true
