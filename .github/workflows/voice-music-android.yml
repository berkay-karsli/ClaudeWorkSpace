name: Voice Music Android

on:
  push:
    paths:
      - "voice-music-android/**"
      - ".github/workflows/voice-music-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-music-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusic-apk
          path: voice-music-android/app/build/outputs/apk/debug/app-debug.apk
