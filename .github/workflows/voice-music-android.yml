name: Voice Music Android

on:
  push:
    paths:
      - "voice-music-android/**"
      - ".github/workflows/voice-music-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-music-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: |
          ./gradlew testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk VoiceMusic.apk
      # Same lookup the app does to find a song. Informational: YouTube can change it at any time.
      - name: Check YouTube Music song lookup
        continue-on-error: true
        run: |
          for q in "bohemian rhapsody" "tarkan kuzu kuzu"; do
            id=$(curl -sS -m 20 -X POST 'https://music.youtube.com/youtubei/v1/search?prettyPrint=false' \
              -H 'Content-Type: application/json' -H 'Origin: https://music.youtube.com' \
              -H 'User-Agent: Mozilla/5.0 (Android) VoiceMusic' \
              -d "{\"context\":{\"client\":{\"clientName\":\"WEB_REMIX\",\"clientVersion\":\"1.20250101.01.00\",\"hl\":\"en\",\"gl\":\"TR\"}},\"query\":\"$q\",\"params\":\"EgWKAQIIAWoKEAoQCRADEAQQBRAV\"}" \
              | grep -oE '"videoId":"[A-Za-z0-9_-]{11}"' | head -1 | cut -d'"' -f4)
            echo "$q -> https://music.youtube.com/watch?v=$id"
            test -n "$id"
            curl -sS "https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=$id&format=json" | grep -oE '"(title|author_name)":"[^"]*"'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMusic-apk
          path: voice-music-android/VoiceMusic.apk
      # A plain .apk download link that works on a phone without logging in.
      - name: Publish to the "voice-music-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-music-latest
          target_commitish: ${{ github.sha }}
          name: Voice Music (latest build)
          body: |
            Latest build of the Voice Music app from `${{ github.ref_name }}` (${{ github.sha }}).
            On your phone, tap **VoiceMusic.apk** below to download and install it.
          files: voice-music-android/VoiceMusic.apk
          make_latest: true
